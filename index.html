<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Control - Reto WebDev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h2 class="mb-4 text-center">Tablero de Control y Misiones</h2>

    <!-- Formulario de envío Maestro-Detalle -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-primary text-white">Registrar / Actualizar Avance</div>
      <div class="card-body">
        <form id="registroForm">
          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">Carné</label>
              <input type="text" id="carnet" class="form-control" required placeholder="Ej: 1890-20-5704">
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombre Completo</label>
              <input type="text" id="nombre" class="form-control" required placeholder="Oscar Leonel Cruz Paredes">
            </div>
            <div class="col-md-4">
              <label class="form-label">Correo Institucional</label>
              <input type="email" id="correo" class="form-control" required placeholder="ocruzp2@miumg.edu.gt">
            </div>
          </div>

          <h5 class="mt-3">Misiones</h5>
          <div id="misionesCheckboxes" class="mb-3">
            <p class="text-muted">Cargando catálogo...</p>
          </div>

          <button type="submit" class="btn btn-success">Enviar Avance (POST)</button>
        </form>
      </div>
    </div>

    <!-- Tabla de Avance de Estudiantes -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>Avance de Estudiantes</span>
        <button class="btn btn-sm btn-outline-light" onclick="cargarEstudiantes()">Refrescar</button>
      </div>
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-secondary">
            <tr>
              <th>Carné</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Misiones Completadas</th>
              <th>Progreso</th>
            </tr>
          </thead>
          <tbody id="tablaEstudiantes">
            <tr><td colspan="5" class="text-center p-3 text-muted">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Cambiar esta URL cuando el backend esté desplegado en la nube
    const API_URL = 'https://reto-webdev-umg.onrender.com/api';

    async function cargarMisiones() {
      try {
        const res = await fetch(`${API_URL}/misiones`);
        const misiones = await res.json();
        const contenedor = document.getElementById('misionesCheckboxes');
        contenedor.innerHTML = misiones.map(m => `
          <div class="form-check">
            <input class="form-check-input mision-check" type="checkbox" value="${m.MisionID}" id="mision_${m.MisionID}">
            <label class="form-check-label" for="mision_${m.MisionID}">
              <strong>Misión ${m.MisionID}:</strong> ${m.Nombre} <small class="text-muted">(${m.Descripcion || ''})</small>
            </label>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('misionesCheckboxes').innerHTML = '<p class="text-danger">Error cargando catálogo.</p>';
      }
    }

    async function cargarEstudiantes() {
      try {
        const res = await fetch(`${API_URL}/estudiantes`);
        const estudiantes = await res.json();
        const tbody = document.getElementById('tablaEstudiantes');

        if (estudiantes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center p-3 text-muted">No hay registros aún.</td></tr>';
          return;
        }

        tbody.innerHTML = estudiantes.map(e => {
          const completadas = e.misiones.filter(m => m.estado).length;
          const total = e.misiones.length;
          const porcentaje = total > 0 ? Math.round((completadas / total) * 100) : 0;

          return `
            <tr>
              <td><strong>${e.carnet}</strong></td>
              <td>${e.nombre}</td>
              <td>${e.correo}</td>
              <td>${completadas} / ${total}</td>
              <td style="width: 200px;">
                <div class="progress">
                  <div class="progress-bar bg-success" role="progressbar" style="width: ${porcentaje}%">${porcentaje}%</div>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('tablaEstudiantes').innerHTML = '<tr><td colspan="5" class="text-center p-3 text-danger">Error al cargar datos.</td></tr>';
      }
    }

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const checkboxes = document.querySelectorAll('.mision-check');
      const detalle = Array.from(checkboxes).map(ch => ({
        misionId: parseInt(ch.value),
        estado: ch.checked
      }));

      const payload = {
        maestro: {
          carnet: document.getElementById('carnet').value.trim(),
          nombre: document.getElementById('nombre').value.trim(),
          correo: document.getElementById('correo').value.trim()
        },
        detalle
      };

      try {
        const res = await fetch(`${API_URL}/registro`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          alert('¡Avance guardado con éxito!');
          cargarEstudiantes();
        } else {
          alert(`Error: ${data.mensaje || data.error}`);
        }
      } catch (err) {
        alert('Error conectando con la API.');
      }
    });

    cargarMisiones();
    cargarEstudiantes();
  </script>
</body>
</html>
